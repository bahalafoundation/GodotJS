name: Bahala host editors

# Builds the Linux and Windows GodotJS host editors bahalafoundation/arcade vendors, and
# publishes them as a GitHub Release, so a Linux or Windows developer pulls an editor with
# `just vendor` instead of compiling Godot for ~20 minutes (bahalafoundation/arcade#169).
#
# What is built: vanilla Godot at build.py's GODOT_VANILLA_REV with this fork linked in as
# modules/godotjs, on the QuickJS-NG backend. Not the bahalafoundation/libgodot fork and not
# JavaScriptCore: these editors run Arcade's City/Blip suites and renders; they are not
# the engine Arcade ships and never export a pack that ships.
#
# The recipe is .github/bahala/build.py's host part (arcade#436): the pin, the scons call,
# the staging, the QuickJS-NG check, the stamp, the notices and the zip, and the smoke test
# of each editor. Arcade's `just engine-build` on Linux and Windows runs the same script
# from the commit this release's tag points at.
#
# Its sibling bahala-libgodot.yml publishes the engine arcade ships (the bahalafoundation/libgodot
# fork: the iOS xcframework, the macOS editor and the Android .aar) the same way.
#
# Upstream's own workflows (runner.yml and the build_* it calls) are disabled on this fork
# in the repository's Actions settings (`gh workflow disable`), not edited, so they stay
# byte-identical to upstream. They default to V8, build every platform, and runner.yml
# fires on `release: published`, i.e. on the releases this workflow creates.
#
# Releases are IMMUTABLE here: arcade pins each zip by SHA-256, and a rebuild of the same
# commits produces different bytes, so re-uploading would break every checkout pinned to
# the old ones. A release is named for the two commits and build.py's HOST_EDITORS_RECIPE;
# if it exists, nothing is built. A change to the recipe that changes what's built bumps
# HOST_EDITORS_RECIPE and so gets a new release.

on:
  push:
    branches: [bahala]
  workflow_dispatch:

concurrency:
  group: bahala-host-editors
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Toolchain, pinned so a release can be rebuilt. node/python/scons match arcade's
  # mise.lock; pnpm is this repo's own `packageManager`.
  NODE_VERSION: 22.23.2
  PNPM_VERSION: 10.11.0
  PYTHON_VERSION: 3.14.7
  SCONS_VERSION: 4.11.1
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: utf8

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      godotjs_rev: ${{ steps.plan.outputs.godotjs_rev }}
      tag: ${{ steps.plan.outputs.tag }}
      godot_vanilla_rev: ${{ steps.plan.outputs.godot_vanilla_rev }}
      recipe: ${{ steps.plan.outputs.recipe }}
      exists: ${{ steps.plan.outputs.exists }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The tag names the last commit that touched the module itself, not HEAD: this
      # workflow's own commits (everything under .github/) change nothing that is compiled,
      # so a commit that only edits .github/ maps to the same tag, finds the release
      # already published, and builds nothing, unless it bumps the recipe version.
      # build.py derives it, as it does for arcade.
      - name: Resolve the module revision and release tag
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/bahala/build.py plan --release host-editors | tee -a "$GITHUB_OUTPUT" > plan.env
          tag=$(sed -n 's/^tag=//p' plan.env)
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exists=true; else exists=false; fi
          # Only `bahala` publishes. A dispatch on any other branch builds and smoke-tests
          # without releasing, which is how to try a change to this workflow.
          if [ "$GITHUB_REF" = "refs/heads/bahala" ]; then publish=true; else publish=false; fi
          {
            echo "exists=$exists"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          cat plan.env
          echo "HEAD is $GITHUB_SHA"
          echo "Release tag: $tag (exists: $exists, publish: $publish)"
          if [ "$exists" = true ]; then
            echo "::notice::$tag is already published; nothing to build (releases are immutable, see the header)"
          fi

  build:
    name: Build (${{ matrix.platform }})
    needs: plan
    if: needs.plan.outputs.exists != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # One LTS behind the newest, as Godot's own CI does, so the binary's glibc floor
          # (2.35) runs on older distros too.
          - platform: linuxbsd
            runs-on: ubuntu-22.04
          - platform: windows
            runs-on: windows-2025
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 240
    env:
      GODOT_VANILLA_REV: ${{ needs.plan.outputs.godot_vanilla_rev }}
      SCONS_CACHE: ${{ github.workspace }}/.scons-cache
      # Caches SCons' MSVC detection, which otherwise costs a minute per run (Godot's own CI).
      SCONS_CACHE_MSVC_CONFIG: "true"
    defaults:
      run:
        shell: bash
    steps:
      # Named godotjs: build.py links it in as the module, and Godot names a module after
      # its directory. Full history, for the module commit the stamp records.
      - name: Check out GodotJS
        uses: actions/checkout@v7
        with:
          path: godotjs
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install SCons
        run: |
          python -m pip install "scons==${SCONS_VERSION}"
          scons --version

      # GodotJS's SCsub runs `pnpm install && pnpm build` to bundle its runtime, so node and
      # pnpm have to be on PATH for scons.
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'linuxbsd'
        run: |
          # wayland-scanner generates the Wayland protocol code at build time; everything
          # else Godot links on Linux is loaded at runtime (use_sowrap). Godot's own CI
          # installs exactly this.
          sudo apt-get update
          sudo apt-get install -y libwayland-bin
          # Room for the object files: the runner image ships the Android SDK.
          sudo rm -rf /usr/local/lib/android

      # Speeds up a warm build; a cold one (no cache, or a new Godot pin) still works.
      - name: Restore the SCons cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SCONS_CACHE }}
          key: scons-${{ matrix.platform }}-${{ env.GODOT_VANILLA_REV }}-${{ github.sha }}
          restore-keys: |
            scons-${{ matrix.platform }}-${{ env.GODOT_VANILLA_REV }}-
            scons-${{ matrix.platform }}-

      - name: Build, check and package
        id: build
        run: python godotjs/.github/bahala/build.py build --part host --tree godot --stage stage --out dist --scons-cache "$SCONS_CACHE"

      # Saved even when the build fails part-way: the objects that did compile still save
      # the next attempt their time.
      - name: Save the SCons cache
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ env.SCONS_CACHE }}
          key: scons-${{ matrix.platform }}-${{ env.GODOT_VANILLA_REV }}-${{ github.sha }}

      - name: Smoke test (--version, GodotJS's tests/project on QuickJS-NG)
        run: |
          # A copy, so the checkout's test project stays pristine.
          cp -r godotjs/tests/project smoke-project
          python godotjs/.github/bahala/build.py smoke --stage stage --project smoke-project

      - uses: actions/upload-artifact@v7
        with:
          name: host-editor-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish the release
    needs: [plan, build]
    if: needs.plan.outputs.exists != 'true' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      GODOTJS_REV: ${{ needs.plan.outputs.godotjs_rev }}
      GODOT_VANILLA_REV: ${{ needs.plan.outputs.godot_vanilla_rev }}
      HOST_EDITORS_RECIPE: ${{ needs.plan.outputs.recipe }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: host-editor-*
          merge-multiple: true
          path: dist

      - name: Write the checksums and release notes
        run: |
          set -euo pipefail
          cd dist
          cat ./*.zip.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG"
          {
            echo "GodotJS host editors for [bahalafoundation/arcade](https://github.com/bahalafoundation/arcade) (#169): vanilla Godot 4.5.1-stable + this fork's GodotJS on **QuickJS-NG**."
            echo
            echo "**Not the engine Arcade ships** (that is the bahalafoundation/libgodot fork on JavaScriptCore). These run the City/Blip suites and renders on Linux and Windows, and never export a pack that ships."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Godot | godotengine/godot@\`$GODOT_VANILLA_REV\` (4.5.1-stable) |"
            echo "| GodotJS | \`$GODOTJS_REV\` (the last module commit; built from \`$GITHUB_SHA\`, identical outside .github/) |"
            echo "| Backend | QuickJS-NG (\`use_quickjs_ng=yes\`) |"
            echo "| Recipe | $HOST_EDITORS_RECIPE (the tag's \`-r$HOST_EDITORS_RECIPE\`; .github/bahala/build.py at this tag, which arcade's \`just engine-build\` runs) |"
            echo "| Toolchain | Python $PYTHON_VERSION, SCons $SCONS_VERSION, node $NODE_VERSION, pnpm $PNPM_VERSION; Linux on ubuntu-22.04 (gcc), Windows on windows-2025 (MSVC) |"
            echo "| Built by | $RUN_URL |"
            echo
            echo "## SHA-256"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
            echo
            echo "## Stamps (\`.build-libgodot-pins.json\` inside each zip)"
            for s in *.stamp.json; do
              echo
              echo "\`${s%.stamp.json}\`:"
              echo '```json'
              cat "$s"
              echo
              echo '```'
            done
            echo
            echo "## vendor.yaml"
            echo
            echo '```yaml'
            for z in *.zip; do
              name="${z%.zip}"
              host="${name#godot-editor-}"
              sha=$(awk -v f="$z" '$2 == f { print $1 }' SHA256SUMS)
              echo "  - name: $name"
              echo "    platforms: [editor]"
              echo "    host: $host"
              echo "    version: 4.5.1"
              echo "    release: $base"
              echo "    artifact: $name"
              echo "    sha256: $sha"
              echo "    unpack: directory"
            done
            echo '```'
            echo
            echo "Every component is MIT-licensed; each zip carries NOTICE.txt and the licence texts under licenses/."
          } > notes.md
          cat notes.md

      # Tagged at the commit this run built ($GITHUB_SHA), not at the module commit the tag
      # names: the plan job proved the two identical outside .github/. GITHUB_TOKEN has no
      # `workflows` permission, so GitHub refuses (403 "Resource not accessible by
      # integration") a new tag whose tree carries workflow files the default branch
      # doesn't, which an older module commit's tree can: fc75c05's carried the #170 spike.
      # $GITHUB_SHA is `bahala`'s head at push time, so its workflows are the branch's own.
      - name: Create the release
        run: |
          set -euo pipefail
          cd dist
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Host editors: Godot ${GODOT_VANILLA_REV:0:7} + GodotJS ${GODOTJS_REV:0:7} (QuickJS-NG)" \
            --notes-file notes.md \
            --latest=false \
            godot-editor-*.zip SHA256SUMS
          echo "::notice::published $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
