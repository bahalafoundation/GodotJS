name: Bahala macOS engine (spike)

# SPIKE for bahalafoundation/arcade#170: can GitHub-hosted macOS runners build the engine
# artifacts arcade's Gitea engine-build.yaml builds on macdaddy today? Dispatch only; it
# publishes nothing (workflow artifacts at most) and arcade does not consume it.
#
# The recipe is arcade's ci/build-libgodot.nu (macOS path), restated here because arcade
# is private: the migeran/libgodot fork at REV with this fork dropped in as
# godot/modules/godotjs, then
#   apple:   custom.py use_jsc=yes, the JavaScriptCore xcconfig hook,
#            scons p=macos target=editor dev_build=yes vulkan=no metal=yes   (host editor)
#            build_libgodot.sh --target ios
#            build_libgodot_xcframework.sh --target template_debug --no-sim
#   android: arcade's two Godot patches (.github/bahala/patches/godot/), the SDK/NDK
#            config.gradle asks for, scons platform=android arch=arm64
#            target=template_debug use_quickjs_ng=yes angle_libs="" opengl3=no, the
#            build.gradle scons-args patch, gradlew generateGodotTemplates
# plus the same byte-level asserts on the results. The two halves run as parallel jobs
# here (on macdaddy they are one job, sequential), each from its own clone of the same
# pinned tree.
#
# It measures what matters for the decision: wall time per stage (the step timings), and
# peak disk (a sampler of the workspace volume's used space, summarised at the end).

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Hosted macOS runner label
        default: xcode-27
        type: choice
        options: [xcode-27, macos-26, macos-15]
      parts:
        description: Which halves to build
        default: both
        type: choice
        options: [both, apple, android]

permissions:
  contents: read

env:
  # ci/build-libgodot.nu's REV (migeran/libgodot; pins the godot submodule too).
  LIBGODOT_REV: fdd3f469b5dda8eee806a02d0ab5d64667bb8552
  NODE_VERSION: 22.23.2
  PNPM_VERSION: 10.11.0
  SCONS_VERSION: 4.11.1
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: ${{ matrix.part }} on ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(inputs.parts == 'both' && '["apple","android"]' || format('["{0}"]', inputs.parts)) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    steps:
      - name: Machine
        run: |
          set -x
          sw_vers
          sysctl -n machdep.cpu.brand_string hw.logicalcpu hw.memsize
          xcodebuild -version
          df -h "$GITHUB_WORKSPACE" /
          # Peak-disk sampler: used KiB on the workspace volume every 10 s, for the summary.
          ( while true; do df -k "$GITHUB_WORKSPACE" | awk 'NR==2 {print $3, $4}' >> "$RUNNER_TEMP/disk.log"; sleep 10; done ) &
          echo "START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check out this fork (GodotJS)
        uses: actions/checkout@v7
        with:
          path: godotjs
          fetch-depth: 0
          submodules: recursive

      - name: Resolve the module revision
        run: |
          set -euo pipefail
          cd godotjs
          rev=$(git log -1 --format=%H HEAD -- . ':(exclude).github' ':(exclude).gitea')
          git diff --quiet "$rev" HEAD -- . ':(exclude).github' ':(exclude).gitea'
          echo "GODOTJS_REV=$rev" >> "$GITHUB_ENV"
          echo "GodotJS module revision: $rev (HEAD $GITHUB_SHA)"

      - name: Clone migeran/libgodot at REV (+ submodules)
        run: |
          set -euo pipefail
          git clone -q https://github.com/migeran/libgodot.git libgodot
          git -C libgodot checkout --quiet "$LIBGODOT_REV"
          git -C libgodot submodule update --init --recursive
          mv godotjs libgodot/godot/modules/godotjs
          test -f libgodot/godot/modules/godotjs/jsb.h
          # ci/build-libgodot.nu's write-custom-py: every scons run in the tree reads it.
          printf '# Written by bahala-macos-engine-spike.yml (arcade ci/build-libgodot.nu) - GodotJS on the JavaScriptCore backend (#44).\nuse_jsc = "yes"\n' > libgodot/godot/custom.py
          du -sh libgodot

      - name: Toolchain
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q "scons==${SCONS_VERSION}"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ---------------------------------------------------------------- apple half ---

      - name: "apple: host editor (scons p=macos target=editor dev_build=yes vulkan=no metal=yes)"
        if: matrix.part == 'apple'
        working-directory: libgodot/godot
        run: |
          set -euo pipefail
          # link-javascriptcore: xcodebuild layers this over the framework project's link line.
          # shellcheck disable=SC2016 # $(inherited) is xcconfig syntax, written literally
          printf '// arcade ci/build-libgodot.nu - GodotJS JavaScriptCore backend (#44).\nOTHER_LDFLAGS = $(inherited) -framework JavaScriptCore\n' > "$RUNNER_TEMP/godotjs.xcconfig"
          echo "XCODE_XCCONFIG_FILE=$RUNNER_TEMP/godotjs.xcconfig" >> "$GITHUB_ENV"
          scons p=macos target=editor dev_build=yes vulkan=no metal=yes "-j$(sysctl -n hw.logicalcpu)"
          df -h "$GITHUB_WORKSPACE"

      - name: "apple: iOS library + xcframework (build_libgodot.sh --target ios; build_libgodot_xcframework.sh)"
        if: matrix.part == 'apple'
        working-directory: libgodot
        run: |
          set -euo pipefail
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          ./build_libgodot.sh --target ios
          df -h "$GITHUB_WORKSPACE"
          ./build_libgodot_xcframework.sh --target template_debug --no-sim
          df -h "$GITHUB_WORKSPACE"

      - name: "apple: stage + assert JavaScriptCore only"
        if: matrix.part == 'apple'
        run: |
          set -euo pipefail
          src=libgodot
          out=stage
          mkdir -p "$out"
          cp -R "$src/build/gdextension/extension_api.json" "$src/build/gdextension/gdextension_interface.h" \
            "$src/libgodot_framework/libgodot/libgodot.h" "$src/build/libgodot/debug/libgodot.xcframework" "$out/"
          cp "$src/godot/bin/godot.macos.editor.dev.arm64" "$out/godot-editor"
          for b in "$out/godot-editor" "$out/libgodot.xcframework/ios-arm64/libgodot.framework/libgodot"; do
            s=$(strings "$b")
            grep -q 'impl/jsc/' <<<"$s" || { echo "$b: no JavaScriptCore backend"; exit 1; }
            if grep -qiE 'quickjs|v8_monolith|v8::internal' <<<"$s"; then echo "$b: another JS engine linked"; exit 1; fi
            echo "$(basename "$b"): JavaScriptCore backend, no other JavaScript engine"
          done
          printf '{\n  "rev": "%s",\n  "godotjs_rev": "%s"\n}' "$LIBGODOT_REV" "$GODOTJS_REV" > "$out/.build-libgodot-pins.json"
          "$out/godot-editor" --version || true
          mkdir -p dist
          ditto -c -k --sequesterRsrc "$out/libgodot.xcframework" dist/libgodot-xcframework.zip
          ditto -c -k --sequesterRsrc "$out/godot-editor" dist/godot-editor.zip
          ls -l dist
          shasum -a 256 dist/*.zip

      # -------------------------------------------------------------- android half ---

      - name: "android: SDK/NDK (versions from config.gradle)"
        if: matrix.part == 'android'
        run: |
          set -euo pipefail
          cfg=libgodot/godot/platform/android/java/app/config.gradle
          field() { grep -E "^\s*$1\s*:" "$cfg" | head -1 | cut -d: -f2- | tr -d " ,'"; }
          sdk=$(field compileSdk); bt=$(field buildTools); ndk=$(field ndkVersion)
          echo "compileSdk=$sdk buildTools=$bt ndk=$ndk"
          java17="${JAVA_HOME_17_arm64:-${JAVA_HOME_17_X64:-}}"
          test -n "$java17"
          echo "JAVA_HOME=$java17" >> "$GITHUB_ENV"
          export JAVA_HOME="$java17"
          sdkm="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkm" --licenses > /dev/null || true
          "$sdkm" --install platform-tools "platforms;android-$sdk" "build-tools;$bt" "ndk;$ndk" > /dev/null
          ls "$ANDROID_HOME/ndk"
          df -h "$GITHUB_WORKSPACE"

      - name: "android: engine (scons platform=android arch=arm64 use_quickjs_ng=yes)"
        if: matrix.part == 'android'
        working-directory: libgodot/godot
        run: |
          set -euo pipefail
          for p in android-gles3-guard android-render-view-lookup; do
            git apply "modules/godotjs/.github/bahala/patches/godot/$p.patch"
            echo "applied $p"
          done
          scons platform=android arch=arm64 target=template_debug use_quickjs_ng=yes angle_libs="" opengl3=no "-j$(sysctl -n hw.logicalcpu)"
          df -h "$GITHUB_WORKSPACE"

      - name: "android: .aar (gradlew generateGodotTemplates)"
        if: matrix.part == 'android'
        working-directory: libgodot/godot
        run: |
          set -euo pipefail
          f=platform/android/java/lib/build.gradle
          # shellcheck disable=SC2016 # ${selectedAbi} is Groovy, matched literally
          anchor='"arch=${selectedAbi}", "-j"'
          grep -qF "$anchor" "$f"
          python3 - "$f" <<'PY'
          import sys
          p = sys.argv[1]
          t = open(p).read()
          t = t.replace('"arch=${selectedAbi}", "-j"', '"arch=${selectedAbi}", "use_quickjs_ng=yes", "-j"')
          open(p, "w").write(t)
          PY
          cd platform/android/java
          GRADLE_OPTS="-Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process" ./gradlew generateGodotTemplates
          df -h "$GITHUB_WORKSPACE"

      - name: "android: stage + asserts (QuickJS-NG only, getRenderView, 16 KB pages)"
        if: matrix.part == 'android'
        run: |
          set -euo pipefail
          mkdir -p dist
          aar=libgodot/godot/bin/godot-lib.template_debug.aar
          cp "$aar" dist/
          so="$RUNNER_TEMP/libgodot_android.so"
          unzip -p "$aar" jni/arm64-v8a/libgodot_android.so > "$so"
          s=$(strings "$so")
          grep -q 'impl/quickjs' <<<"$s" || { echo "no QuickJS-NG"; exit 1; }
          if grep -qiE 'v8_monolith|v8::internal|impl/jsc/' <<<"$s"; then echo "another JS engine linked"; exit 1; fi
          grep -q getRenderView <<<"$s" || { echo "no getRenderView lookup"; exit 1; }
          readelf=$(find "$ANDROID_HOME"/ndk/*/toolchains/llvm/prebuilt -path '*/bin/llvm-readelf' | head -1)
          "$readelf" -l "$so" | awk '$1=="LOAD" {print $NF}' | sort -u | tee "$RUNNER_TEMP/align"
          test "$(cat "$RUNNER_TEMP/align")" = 0x4000
          echo "QuickJS-NG only, getRenderView present, 16 KB aligned"
          ditto -c -k --sequesterRsrc dist/godot-lib.template_debug.aar dist/godot-lib-android-aar.zip
          rm dist/godot-lib.template_debug.aar
          ls -l dist
          shasum -a 256 dist/*.zip

      # ------------------------------------------------------------------- report ---

      - name: Summary (wall time, peak disk)
        if: always()
        run: |
          end=$(date +%s)
          free_min=$(awk 'NR==1 || $2<m {m=$2} END {print m}' "$RUNNER_TEMP/disk.log")
          used_min=$(awk 'NR==1 || $1<m {m=$1} END {print m}' "$RUNNER_TEMP/disk.log")
          used_max=$(awk '$1>m {m=$1} END {print m}' "$RUNNER_TEMP/disk.log")
          {
            echo "### ${{ matrix.part }} on ${{ inputs.runner }}"
            echo
            echo "- wall time from first step: $(( (end - START) / 60 )) min $(( (end - START) % 60 )) s"
            echo "- volume used: start $((used_min / 1048576)) GiB, peak $((used_max / 1048576)) GiB (+$(( (used_max - used_min) / 1048576 )) GiB)"
            echo "- lowest free space: $((free_min / 1048576)) GiB"
            echo "- libgodot tree now: $(du -sh libgodot 2>/dev/null | cut -f1)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: spike-${{ matrix.part }}-${{ inputs.runner }}
          path: dist/
          retention-days: 7
