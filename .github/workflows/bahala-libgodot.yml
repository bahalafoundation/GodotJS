name: Bahala libgodot

# Builds the engine bahalafoundation/arcade embeds and ships, and publishes it as a GitHub
# Release that arcade's vendor.yaml pins (bahalafoundation/arcade#170):
#
#   libgodot-xcframework.zip       the iOS engine, GodotJS on JavaScriptCore: the device
#                                  slice the app ships, and an arm64 Simulator slice
#                                  (ad-hoc signed) its Simulator UI tests boot (arcade#177)
#   godot-editor-macos-arm64.zip   the macOS arm64 host editor from the same tree (it
#                                  exports the packs the engines above/below load)
#   godot-lib-android-aar.zip      the Android engine, GodotJS on QuickJS-NG
#   libgodot-symbols.zip           both engines' debug symbols, for arcade's crash
#                                  reporting (arcade#260); not vendored, see below
#
# The recipe is .github/bahala/build.py (arcade#436): the pins, every scons and gradle
# call, the staging, the byte-level checks and the packaging. This workflow is the
# orchestration around it: runners, toolchains, the two halves in parallel, the artifacts,
# the release. Arcade's `just engine-build` runs the same script from the commit a
# release's tag points at, so a local build is this build.
#
# Debug symbols (arcade#261). The release's engines are compiled with debug_symbols=yes
# (build.py --symbols). Their DWARF (each iOS slice's dSYM, and the Android .so as scons
# linked it, before gradle strips it) is sorted by Sentry's `symsorter -z` into
# Symbolicator's `unified` layout, unified/<id[0:2]>/<id[2:]>/{debuginfo,executable} keyed
# by Mach-O UUID or ELF build id and zstd-compressed, the tree arcade copies into R2 when
# its pin moves. Symbols can only come from the run that publishes: -g changes code layout,
# so a build without it can never be symbolicated, and a later rebuild runs on a different
# hosted Xcode. They stay out of what arcade vendors: the xcframework carries no dSYMs and
# no debug map, and the .aar's .so is stripped, so the pinned zips don't grow.
#
# Sibling of bahala-host-editors.yml (#169), which publishes the Linux/Windows host editors
# built from VANILLA Godot. This one builds the bahalafoundation/godot fork at build.py's
# LIBGODOT_REV, with this fork linked in as godot/modules/godotjs, through libgodot's iOS
# build scripts in .github/bahala/libgodot/ (arcade#438). GitHub-hosted macOS
# minutes are free on this public repo, and it needs no credential beyond this workflow's
# own GITHUB_TOKEN.
#
# The runner is `xcode-27`: macOS 27 with Xcode 27.0 (27A266a), exactly what macdaddy runs
# arcade's app builds with. It is a public-preview label; if it goes away or breaks,
# dispatch with runner=macos-26 (GA, Xcode 26.6), which built this recipe green in
# the #170 spike (run 36254045473, ~39 min). The Xcode a release was built with is in its
# notes. Both are 3-vCPU M1 VMs with 7 GB RAM: with debug symbols the Apple half takes
# ~62 min there, the Android half ~30 min, in parallel, and neither comes near the disk.
#
# Releases are IMMUTABLE here: arcade pins each zip by SHA-256, and a rebuild of the same
# commits produces different bytes (the xcframework is not reproducible bit-for-bit), so
# re-uploading would break every checkout pinned to the old ones. A release is named for
# what it was built from: the two commits and build.py's LIBGODOT_RECIPE, the version of
# the recipe. If that release exists, nothing is built. A change to the recipe that
# changes what's built bumps LIBGODOT_RECIPE, and so gets a new release rather than
# silently mapping onto the old one; a change that doesn't (a comment, the notes) leaves
# it alone and builds nothing. All four artifacts come from one run or none: a failed
# half publishes nothing, and re-running the failed job completes the release.

on:
  push:
    branches: [bahala]
  workflow_dispatch:
    inputs:
      runner:
        description: Hosted macOS runner label (xcode-27; macos-26 is the fallback, see the header)
        default: xcode-27
        type: choice
        options: [xcode-27, macos-26]

concurrency:
  group: bahala-libgodot
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Toolchain. node/python/scons match arcade's mise.lock; pnpm is this repo's own
  # `packageManager`. Java 17 and the Android SDK come from the runner image; the NDK,
  # platform and build-tools versions are read from the godot fork's config.gradle.
  NODE_VERSION: 22.23.2
  PNPM_VERSION: 10.11.0
  SCONS_VERSION: 4.11.1
  PYTHONUNBUFFERED: "1"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      godotjs_rev: ${{ steps.plan.outputs.godotjs_rev }}
      tag: ${{ steps.plan.outputs.tag }}
      libgodot_rev: ${{ steps.plan.outputs.libgodot_rev }}
      recipe: ${{ steps.plan.outputs.recipe }}
      symsorter_version: ${{ steps.plan.outputs.symsorter_version }}
      exists: ${{ steps.plan.outputs.exists }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The tag names the last commit outside .github/ (so a commit that only touches CI
      # files maps to the same tag, finds the release published, and builds nothing),
      # LIBGODOT_REV and the recipe version (so one that changes what's built maps to a
      # new tag and builds). build.py derives it, as it does for arcade.
      - name: Resolve the module revision and release tag
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/bahala/build.py plan --release libgodot | tee -a "$GITHUB_OUTPUT" > plan.env
          tag=$(sed -n 's/^tag=//p' plan.env)
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exists=true; else exists=false; fi
          # Only `bahala` publishes. A dispatch on any other branch builds and checks
          # without releasing, which is how to try a change to this workflow.
          if [ "$GITHUB_REF" = "refs/heads/bahala" ]; then publish=true; else publish=false; fi
          {
            echo "exists=$exists"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          cat plan.env
          echo "HEAD is $GITHUB_SHA"
          echo "Release tag: $tag (exists: $exists, publish: $publish)"
          if [ "$exists" = true ]; then
            echo "::notice::$tag is already published; nothing to build (releases are immutable, see the header)"
          fi

  build:
    name: Build (${{ matrix.part }})
    needs: plan
    if: needs.plan.outputs.exists != 'true'
    strategy:
      fail-fast: false
      matrix:
        # Two halves of one engine build, in parallel, each from its own clone of the same
        # pinned tree (arcade's local build runs them one after the other in one tree).
        part: [apple, android]
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Runner
        run: |
          sw_vers
          sysctl -n machdep.cpu.brand_string hw.logicalcpu hw.memsize
          xcodebuild -version
          df -h "$GITHUB_WORKSPACE"

      # Named godotjs: build.py links it in as the module, and Godot names a module after
      # its directory. Full history, for the module commit the stamp records.
      - name: Check out GodotJS
        uses: actions/checkout@v7
        with:
          path: godotjs
          submodules: recursive
          fetch-depth: 0

      - name: Install SCons
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q "scons==${SCONS_VERSION}"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      # GodotJS's SCsub runs `pnpm install && pnpm build` to bundle its runtime.
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Before the toolchain: the Android one is read from this tree's config.gradle.
      # The tree is libgodot/: the godot fork in godot/, libgodot's scripts beside it. Its
      # absolute path is in the debug map, so it moves the Mach-O UUIDs: keep the name.
      - name: Engine source (bahalafoundation/godot at build.py's LIBGODOT_REV)
        run: python3 godotjs/.github/bahala/build.py source --part ${{ matrix.part }} --tree libgodot

      - name: "Android: SDK platform, build-tools and NDK (from config.gradle)"
        if: matrix.part == 'android'
        run: |
          set -euo pipefail
          cfg=libgodot/godot/platform/android/java/app/config.gradle
          field() { grep -E "^\s*$1\s*:" "$cfg" | head -1 | cut -d: -f2- | tr -d " ,'"; }
          sdk=$(field compileSdk); bt=$(field buildTools); ndk=$(field ndkVersion)
          echo "config.gradle: compileSdk $sdk, buildTools $bt, NDK $ndk"
          # The JDK config.gradle's javaVersion asks for (arcade pins the same in .mise.toml).
          java17="${JAVA_HOME_17_arm64:-}"
          test -n "$java17"
          echo "JAVA_HOME=$java17" >> "$GITHUB_ENV"
          export JAVA_HOME="$java17"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install platform-tools "platforms;android-$sdk" "build-tools;$bt" "ndk;$ndk" > /dev/null
          ls "$ANDROID_HOME/ndk"

      - name: Build, check and package (${{ matrix.part }})
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process
        run: python3 godotjs/.github/bahala/build.py build --part ${{ matrix.part }} --tree libgodot --stage stage --out dist --symbols symbols

      - uses: actions/upload-artifact@v7
        with:
          name: libgodot-${{ matrix.part }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      # Not libgodot-*: the publish job's pattern would merge the loose tree into its dist/.
      - uses: actions/upload-artifact@v7
        with:
          name: symbols-${{ matrix.part }}
          path: symbols/
          if-no-files-found: error
          retention-days: 14
          # Already zstd.
          compression-level: 0

  # One asset for both halves' symbols, built on every run (a dispatch off `bahala` too),
  # so what a release would carry is checked before any release exists.
  symbols:
    name: Package the debug symbols
    needs: [plan, build]
    if: needs.plan.outputs.exists != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: godotjs
          sparse-checkout: .github/bahala

      - uses: actions/download-artifact@v8
        with:
          pattern: symbols-*
          merge-multiple: true
          path: symbols

      - name: Zip libgodot-symbols.zip
        run: python3 godotjs/.github/bahala/build.py symbols --symbols symbols --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: libgodot-symbols
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish the release
    needs: [plan, build, symbols]
    if: needs.plan.outputs.exists != 'true' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      GODOTJS_REV: ${{ needs.plan.outputs.godotjs_rev }}
      LIBGODOT_REV: ${{ needs.plan.outputs.libgodot_rev }}
      LIBGODOT_RECIPE: ${{ needs.plan.outputs.recipe }}
      SYMSORTER_VERSION: ${{ needs.plan.outputs.symsorter_version }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: libgodot-*
          merge-multiple: true
          path: dist

      - name: Write the checksums and release notes
        run: |
          set -euo pipefail
          cd dist
          cat ./*.zip.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG"
          sha() { awk -v f="$1" '$2 == f { print $1 }' SHA256SUMS; }
          {
            echo "The engine [bahalafoundation/arcade](https://github.com/bahalafoundation/arcade) embeds and ships (#170): the bahalafoundation/godot fork + this fork's GodotJS."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Godot | bahalafoundation/godot@\`$LIBGODOT_REV\` (fork of migeran/godot, Godot 4.5.1, arcade#171), built as libgodot by .github/bahala/libgodot/ (arcade#438) |"
            echo "| Recipe | $LIBGODOT_RECIPE (the tag's \`-r$LIBGODOT_RECIPE\`; .github/bahala/build.py at this tag, which arcade's \`just engine-build\` runs) |"
            echo "| xcframework | \`ios-arm64\` (device, what ships) + \`ios-arm64-simulator\` (arm64, ad-hoc signed, arcade#177) |"
            echo "| GodotJS | \`$GODOTJS_REV\` (the last module commit; built from \`$GITHUB_SHA\`, identical outside .github/) |"
            echo "| Backends | JavaScriptCore (iOS xcframework, macOS editor); QuickJS-NG (Android .aar) |"
            echo "| Symbols | \`libgodot-symbols.zip\`: both engines' DWARF, \`symsorter -z\` $SYMSORTER_VERSION (arcade#261) |"
            echo "| Toolchain | $(head -1 xcode-version.txt) ($(tail -1 xcode-version.txt)), SCons $SCONS_VERSION, node $NODE_VERSION, pnpm $PNPM_VERSION, JDK 17 |"
            echo "| Built by | $RUN_URL |"
            echo
            echo "## SHA-256"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
            echo
            echo "## Stamp (\`.build-libgodot-pins.json\` inside godot-editor-macos-arm64.zip)"
            echo
            echo '```json'
            cat godot-editor-macos-arm64.stamp.json
            echo
            echo '```'
            echo
            echo "## Debug symbols"
            echo
            echo "\`libgodot-symbols.zip\` holds Symbolicator's \`unified\` layout (zstd) for these ids (Mach-O UUID or ELF build id), for arcade to copy into R2. It is never vendored."
            echo
            echo '```'
            cat libgodot-symbols.ids
            echo '```'
            echo
            echo "## vendor.yaml"
            echo
            echo '```yaml'
            echo "  - name: libgodot"
            echo "    platforms: [ios]"
            echo "    version: 4.5.1"
            echo "    release: $base"
            echo "    artifact: libgodot-xcframework"
            echo "    sha256: $(sha libgodot-xcframework.zip)"
            echo "    unpack: xcframework"
            echo "  - name: godot-editor-macos-arm64"
            echo "    platforms: [editor, ios, android, content]"
            echo "    host: macos-arm64"
            echo "    version: 4.5.1"
            echo "    release: $base"
            echo "    artifact: godot-editor-macos-arm64"
            echo "    sha256: $(sha godot-editor-macos-arm64.zip)"
            echo "    unpack: directory"
            echo "  - name: libgodot-android"
            echo "    platforms: [android]"
            echo "    version: 4.5.1"
            echo "    release: $base"
            echo "    artifact: godot-lib-android-aar"
            echo "    sha256: $(sha godot-lib-android-aar.zip)"
            echo "    unpack: aar"
            echo '```'
            echo
            echo "Every component is MIT-licensed; NOTICE.txt and the licence texts are attached, and the editor's zip carries them too."
          } > notes.md
          cat notes.md

      # Tagged at the commit this run built ($GITHUB_SHA), not at the module commit the tag
      # names: the plan job proved the two identical outside .github/. GITHUB_TOKEN has no
      # `workflows` permission, so GitHub refuses (403 "Resource not accessible by
      # integration") a new tag whose tree carries workflow files the default branch
      # doesn't, which an older module commit's tree can: fc75c05's carried the #170 spike.
      # $GITHUB_SHA is `bahala`'s head at push time, so its workflows are the branch's own,
      # and its build.py is the recipe arcade's `just engine-build` checks out by this tag.
      - name: Create the release
        run: |
          set -euo pipefail
          cd dist
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Engine: Godot ${LIBGODOT_REV:0:7} + GodotJS ${GODOTJS_REV:0:7} (recipe ${LIBGODOT_RECIPE})" \
            --notes-file notes.md \
            --latest=false \
            libgodot-xcframework.zip godot-editor-macos-arm64.zip godot-lib-android-aar.zip libgodot-symbols.zip \
            SHA256SUMS NOTICE.txt ./*-LICENSE.txt godot-COPYRIGHT.txt
          echo "::notice::published $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
